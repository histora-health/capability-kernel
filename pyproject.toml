[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capability-kernel"
version = "0.1.0"
description = "A firmware layer between what a clinical agent proposes and what the world executes."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Running a local model: the production path and both case benchmarks.
local = ["llama-cpp-python>=0.3", "numpy>=1.24"]
# experiments/mask/ only — the retired sampler arm, kept runnable so the
# measurement that retired it can still be reproduced.
mask = ["transformers>=5.5", "torch", "accelerate", "tokenizers>=0.15"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# experiments/mask/tests runs separately: it needs the [mask] extras and imports
# its modules by bare name, which only works from inside that directory.
norecursedirs = ["experiments"]
